<text x="391" y="275" fill="#39D2E8" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">2</text>
<text x="376" y="317" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Define testing</text>
<text x="376" y="348" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">objectives</text>
<text x="376" y="383" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Set quality needs</text>
<rect x="660" y="230" width="266" height="180" rx="18" fill="#10263B" stroke="#39D2E8" stroke-width="1.8"/>
<circle cx="697" cy="267" r="20" fill="#071523" stroke="#39D2E8" stroke-width="1.8"/>
<text x="697" y="275" fill="#39D2E8" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">3</text>
<text x="682" y="317" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Select tools</text>
<text x="682" y="348" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">and frameworks</text>
<text x="682" y="383" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Fit the product</text>
<rect x="966" y="230" width="266" height="180" rx="18" fill="#10263B" stroke="#39D2E8" stroke-width="1.8"/>
<circle cx="1003" cy="267" r="20" fill="#071523" stroke="#39D2E8" stroke-width="1.8"/>
<text x="1003" y="275" fill="#39D2E8" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">4</text>
<text x="988" y="317" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Build a reusable</text>
<text x="988" y="348" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">test framework</text>
<text x="988" y="383" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Standardize checks</text>
<rect x="966" y="525" width="266" height="180" rx="18" fill="#10263B" stroke="#39D2E8" stroke-width="1.8"/>
<circle cx="1003" cy="562" r="20" fill="#071523" stroke="#39D2E8" stroke-width="1.8"/>
<text x="1003" y="570" fill="#39D2E8" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="988" y="612" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Integrate tests</text>
<text x="988" y="643" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">into CI/CD</text>
<text x="988" y="678" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Trigger validation</text>
<rect x="660" y="525" width="266" height="180" rx="18" fill="#10263B" stroke="#39D2E8" stroke-width="1.8"/>
<circle cx="697" cy="562" r="20" fill="#071523" stroke="#39D2E8" stroke-width="1.8"/>
<text x="697" y="570" fill="#39D2E8" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">6</text>
<text x="682" y="612" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Establish quality</text>
<text x="682" y="643" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">gates</text>
<text x="682" y="678" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Define release criteria</text>
<rect x="354" y="525" width="266" height="180" rx="18" fill="#10263B" stroke="#48D9AE" stroke-width="1.8"/>
<circle cx="391" cy="562" r="20" fill="#071523" stroke="#48D9AE" stroke-width="1.8"/>
<text x="391" y="570" fill="#48D9AE" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">7</text>
<text x="376" y="612" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Monitor, analyze</text>
<text x="376" y="643" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">and optimize</text>
<text x="376" y="678" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Learn from results</text>
<text x="65" y="536" fill="#48D9AE" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Use evidence to</text>
<text x="65" y="566" fill="#48D9AE" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">refine workflows</text>
<text x="65" y="596" fill="#48D9AE" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">and objectives</text>
<text x="640" y="764" fill="#B6C8D8" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="middle" letter-spacing="0">Review outcomes and repeat the cycle as the product evolves.</text>
</svg>