<text x="70" y="317" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Assess current</text>
<text x="70" y="348" fill="#F3F8FC" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">workflow</text>
<text x="70" y="383" fill="#B6C8D8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Map delivery risks</text>
<rect x="354" y="230" width="266" height="180" rx="18" fill="#10263B" stroke="#39D2E8" stroke-width="1.8"/>
