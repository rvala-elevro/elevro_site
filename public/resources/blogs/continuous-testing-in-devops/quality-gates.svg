</text><text x="1152" y="214" font-size="18" fill="#c6d7ec" font-weight="400" text-anchor="start">Vulnerability scans,</text><text x="1152" y="236" font-size="18" fill="#c6d7ec" font-weight="400" text-anchor="start">policy and compliance.</text><rect x="415" y="352" width="610" height="119" rx="16" fill="url(#card)" stroke="#61e9df99" stroke-width="1.6"/><rect x="416" y="364" width="4" height="95" rx="2" fill="#61e9df" stroke="none" stroke-width="1.6"/><path d="M16 2L29 7V16Q29 25 16 31Q3 25 3 16V7Z M9 16L14 21L23 11" transform="translate(432 369) scale(0.90625)" stroke="#61e9df" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="472" y="397" font-size="30" fill="#f2f6ff" font-weight="650" text-anchor="start">Quality gate</text><text x="432" y="431" font-size="22" fill="#c6d7ec" font-weight="400" text-anchor="start">Evaluate evidence against release criteria, risk and</text><text x="432" y="457" font-size="22" fill="#c6d7ec" font-weight="400" text-anchor="start">policy.</text><rect x="55" y="535" width="420" height="122" rx="16" fill="url(#card)" stroke="#5ce5ae99" stroke-width="1.6"/><rect x="56" y="547" width="4" height="98" rx="2" fill="#5ce5ae" stroke="none" stroke-width="1.6"/><path d="M16 2A14 14 0 1 0 16 30A14 14 0 1 0 16 2 M8 16L14 22L24 10" transform="translate(72 552) scale(0.90625)" stroke="#5ce5ae" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="112" y="576" font-size="26" fill="#f2f6ff" font-weight="650" text-anchor="start">PASS</text><text x="72" y="608" font-size="20" fill="#c6d7ec" font-weight="400" text-anchor="start">All required quality criteria are met.</text><rect x="510" y="535" width="420" height="122" rx="16" fill="url(#card)" stroke="#bbaaff99" stroke-width="1.6"/><rect x="511" y="547" width="4" height="98" rx="2" fill="#bbaaff" stroke="none" stroke-width="1.6"/><path d="M21 21L30 30 M13 3A10 10 0 1 0 13 23A10 10 0 1 0 13 3" transform="translate(527 552) scale(0.90625)" stroke="#bbaaff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="567" y="576" font-size="26" fill="#f2f6ff" font-weight="650" text-anchor="start">REVIEW</text><text x="527" y="608" font-size="20" fill="#c6d7ec" font-weight="400" text-anchor="start">Criteria partially met; assess risk.</text><rect x="965" y="535" width="420" height="122" rx="16" fill="url(#card)" stroke="#ff94ba99" stroke-width="1.6"/><rect x="966" y="547" width="4" height="98" rx="2" fill="#ff94ba" stroke="none" stroke-width="1.6"/><path d="M16 2A14 14 0 1 0 16 30A14 14 0 1 0 16 2 M10 10L22 22 M22 10L10 22" transform="translate(982 552) scale(0.90625)" stroke="#ff94ba" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="1022" y="576" font-size="26" fill="#f2f6ff" font-weight="650" text-anchor="start">STOP</text><text x="982" y="608" font-size="20" fill="#c6d7ec" font-weight="400" text-anchor="start">Significant quality criteria are not met.</text><rect x="510" y="698" width="420" height="145" rx="16" fill="url(#card)" stroke="#bbaaff99" stroke-width="1.6"/><rect x="511" y="710" width="4" height="121" rx="2" fill="#bbaaff" stroke="none" stroke-width="1.6"/><path d="M16 2A6 6 0 1 0 16 14A6 6 0 1 0 16 2 M5 29V25Q5 17 16 17Q27 17 27 25V29Z" transform="translate(527 715) scale(0.90625)" stroke="#bbaaff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="567" y="735" font-size="22" fill="#f2f6ff" font-weight="650" text-anchor="start">Owner-approved exception / risk</text><text x="567" y="760" font-size="22" fill="#f2f6ff" font-weight="650" text-anchor="start">review</text><text x="527" y="792" font-size="20" fill="#c6d7ec" font-weight="400" text-anchor="start">Assess risk, define mitigation and</text><text x="527" y="816" font-size="20" fill="#c6d7ec" font-weight="400" text-anchor="start">approve or reject.</text><rect x="965" y="698" width="420" height="145" rx="16" fill="url(#card)" stro